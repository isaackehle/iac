# PostgreSQL — Docker Compose Stack
#
# Stack version: 2.0
# Purpose: PostgreSQL database server with pgAdmin interface
#
# Pattern B (Tailscale sidecar): `primary` and `admin` both run
# `network_mode: service:tailscale-sidecar` and have no ports of their own.
# The sidecar owns the netns and publishes port 2665 via Tailscale serve.
#
# Services:
#   - primary (PostgreSQL database)
#   - admin (pgAdmin web interface)
#   - tailscale-sidecar (Tailscale sidecar — owns the netns for primary/admin)
#
# Environment variables:
#   - STACK_NAME=PostgreSQL
#   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
#   - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
#   - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f postgresql.yaml up -d
#   docker compose -f postgresql.yaml down
#
name: postgresql

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: postgres
    container_name: postgresql

    # ── Lifecycle ─────────────────────────────────────────────
    restart: on-failure:5
    depends_on:
      tailscale-sidecar:
        condition: service_started

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar  # Borrow the sidecar's namespace

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/postgresql:/var/lib/postgresql:rw

    # ── Environment ───────────────────────────────────────────
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=thunder_db

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "thunder_db", "-U", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpu_shares: 768

  # ── Identity ──────────────────────────────────────────────
  admin:
    image: dpage/pgadmin4:latest
    container_name: pgAdmin

    # ── Lifecycle ─────────────────────────────────────────────
    restart: on-failure:5
    depends_on:
      tailscale-sidecar:
        condition: service_started
      primary:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar  # Borrow the sidecar's namespace

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/postgresql/pgadmin:/var/lib/pgadmin:rw

    # ── Environment ───────────────────────────────────────────
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_LISTEN_PORT=5050

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5050"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpu_shares: 768
    user: "0:0"

  # ── Identity ──────────────────────────────────────────────
  tailscale-sidecar:
    image: tailscale/tailscale:latest
    container_name: ts-postgresql

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    # Must join postgresql-net: `primary` and `admin` borrow this namespace
    # Also join langfuse_langfuse-net so langfuse can reach postgresql by hostname
    networks:
      - postgresql-net
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/postgresql/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/postgresql/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=postgresql
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "2665:5432"     # Raw Postgres port for external (tailnet) connections

networks:
  postgresql-net:
    driver: bridge
  langfuse_langfuse-net:
    external: true
    name: langfuse_langfuse-net
