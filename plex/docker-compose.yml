# Plex — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Media server with Tailscale sidecar pattern
#
# Services:
#   - plex
#   - ts-plex (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=Plex
#   - PLEX_CLAIM=${PLEX_CLAIM}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f plex.yaml up -d
#   docker compose -f plex.yaml down
#
name: Plex
version: "3.8"

services:
  # ── Identity ──────────────────────────────────────────────
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - ts-plex

    # ── Network ───────────────────────────────────────────────
    network_mode: service:ts-plex  # Borrow the sidecar's network namespace

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/plex/config:/config      # Application config & metadata
      - /volume1/media:/media                           # Media libraries

    # ── Environment ───────────────────────────────────────────
    environment:
      - PUID=1000                       # User ID for file ownership
      - PGID=1000                       # Group ID for file ownership
      - VERSION=docker                  # Plex update channel
      - PLEX_CLAIM=${PLEX_CLAIM}        # Claim token from https://plex.tv/claim

  # ── Identity ──────────────────────────────────────────────
  ts-plex:
    image: tailscale/tailscale:latest
    container_name: ts-plex

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/plex/ts-state:/var/lib/tailscale  # Tailscale state
      - /volume1/docker/stacks/plex/ts-config:/config            # Tailscale serve config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=plex                      # Tailnet-facing hostname
      - TS_AUTHKEY=${TS_AUTHKEY}              # Tailscale auth key
      - TS_STATE_DIR=/var/lib/tailscale       # State directory
      - TS_AUTH_ONCE=true                     # Ephemeral node
      - TS_SERVE_CONFIG=/config/serve.json    # Serve config path

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN     # Create/manage network tunnels (TUN device)
      - NET_RAW       # Raw socket access for packet manipulation
    devices:
      - /dev/net/tun:/dev/net/tun  # TUN device for virtual network interface
