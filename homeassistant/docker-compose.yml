services:
  ts-homeassistant:
    image: tailscale/tailscale:latest
    container_name: ts-homeassistant
    restart: unless-stopped
    volumes:
    - /volume1/docker/stacks/homeassistant/ts-state:/var/lib/tailscale
    - /volume1/docker/stacks/homeassistant/ts-config:/config
    environment:
    - TS_HOSTNAME=homeassistant
    - TS_AUTHKEY=${TS_AUTHKEY}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_AUTH_ONCE=true
    - TS_SERVE_CONFIG=/config/serve.json
    cap_add:
    - NET_ADMIN
    - NET_RAW
    devices:
    - /dev/net/tun:/dev/net/tun
