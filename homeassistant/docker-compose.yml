# Home Assistant — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Smart home automation platform
#
# Services:
#   - homeassistant
#   - ts-homeassistant (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=HomeAssistant
#   - TZ=${TZ}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f homeassistant.yaml up -d
#   docker compose -f homeassistant.yaml down
#
name: homeassistant
version: "3.8"

services:
  # ── Identity ──────────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    privileged: true                # Required for some hardware integrations
    depends_on:
      - ts-homeassistant

    # ── Network ───────────────────────────────────────────────
    network_mode: host              # Use host networking for device discovery

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}

  # ── Identity ──────────────────────────────────────────────
  ts-homeassistant:
    image: tailscale/tailscale:latest
    container_name: ts-homeassistant

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - homeassistant

    # ── Network ───────────────────────────────────────────────
    network_mode: service:homeassistant

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/homeassistant/ts-state:/var/lib/tailscale

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=homeassistant
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
