# Home Assistant — Docker Compose Stack
#
# Stack version: 2.0
# Purpose: Smart home automation platform
#
# Services:
#   - homeassistant
#
# Tailnet access: Pattern A (host-level `tailscale serve`), NOT a sidecar.
#
#   Home Assistant requires `network_mode: host` for device discovery — mDNS,
#   Chromecast, HomeKit, and most local-network integrations do not work from
#   inside a bridge network. That rules out the Tailscale sidecar pattern: a
#   sidecar using `network_mode: service:homeassistant` would land in the
#   *host* network namespace, running a second tailscaled alongside the NAS's
#   own daemon. Both would compete to manage tailnet state on the same netns.
#
#   So this stack uses the NAS host's own tailscaled instead, same as affine,
#   frigate, and postgresql. The mapping lives in scripts/lib.sh under
#   STACK_SERVE_PORTS and is applied by scripts/serve-all.sh — there is
#   deliberately no serve.json, no ts-state, and no ts-config here.
#
#   See AGENTS.md "Two competing Tailscale deployment patterns" and
#   docs/006_docker_compose_standards.md correctness rule 3.
#
# Environment variables:
#   - STACK_NAME=HomeAssistant
#   - TZ=${TZ}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose up -d
#   docker compose down
#   scripts/serve-all.sh <ssh-host>    # applies the host-level serve mapping
#

name: homeassistant

services:
  # ── Identity ──────────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    privileged: true                # Required for some hardware integrations

    # ── Network ───────────────────────────────────────────────
    network_mode: host              # Required for device discovery — see header

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}
