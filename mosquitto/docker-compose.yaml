services:
  # ---------------------------------------------------------------------------
  # Main application — Eclipse Mosquitto MQTT broker
  # ---------------------------------------------------------------------------
  mosquitto:
    # 1. Identity (rarely changes)
    image: eclipse-mosquitto:2.0           # Official Eclipse Mosquitto 2.0 MQTT broker image
    container_name: mosquitto              # Fixed container name for cross-stack references

    # 2. Lifecycle (occasionally changes)
    restart: unless-stopped                # Restart on crash or Docker daemon reboot; stop only on manual intervention

    # 3. Network
    ports:
      - "1883:1883"                        # MQTT plain TCP — standard IoT/device port
      - "9001:9001"                        # MQTT over WebSocket — Home Assistant web UI connectivity

    # 4. Storage
    volumes:
      - ./certs:/mosquitto/certs:ro        # [secret] TLS certificates (read-only, sensitive)
      - ./data:/mosquitto/data             # [state]  Persistent data: retained messages, sessions, persistence DB
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro  # [config] Broker configuration (read-only)

    # 5. Environment (changes frequently with secrets)
    environment:
      TZ: ${TZ}                            # Timezone for log timestamps and scheduled tasks