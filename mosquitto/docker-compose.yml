# Mosquitto — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: MQTT broker for IoT device communication
#
# Services:
#   - primary
#
# Environment variables:
#   - STACK_NAME=Mosquitto
#   - TZ=${TZ}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f mosquitto.yaml up -d
#   docker compose -f mosquitto.yaml down
#
name: mosquitto

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "1883:1883"         # MQTT plain TCP — standard IoT/device port
      - "9001:9001"         # MQTT over WebSocket — Home Assistant web UI

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ./certs:/mosquitto/certs:ro     # TLS certificates (read-only)
      - ./data:/mosquitto/data          # Persistent data: retained messages, sessions
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro  # Broker config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}                        # Timezone for log timestamps
