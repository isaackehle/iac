# Mosquitto broker configuration for Synology NAS
# This is a minimal, secure setup for Zigbee2MQTT integration

# Listener ports
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Persistence (keep messages and subscriptions across restarts)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type warning
log_type error

# Security - anonymous access disabled by default
allow_anonymous false

# Password file location
password_file /mosquitto/data/password

# Include additional config if needed (for ACLs, TLS, etc.)
include_dir /mosquitto/config/conf.d
