# Portainer — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Docker management interface with Tailscale sidecar
#
# Services:
#   - portainer
#   - caddy-sidecar (Caddy reverse proxy)
#   - tailscale-sidecar (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=Portainer
#   - TS_HOSTNAME_PORTAINER=${TS_HOSTNAME_PORTAINER:-portainer}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f portainer.yaml up -d
#   docker compose -f portainer.yaml down
#

name: portainer

services:
  # ── Identity ──────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    # ── Lifecycle ─────────────────────────────────────────────
    restart: always
    depends_on:
      - tailscale-sidecar

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar
    security_opt:
      - no-new-privileges:true

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/stacks/portainer/data:/data

    # ── Environment ───────────────────────────────────────────
    env_file:
      - /volume1/docker/stacks/portainer/.env

  # ── Identity ──────────────────────────────────────────────
  # Caddy sits behind tailscale-sidecar's TCPForward+TerminateTLS serve config.
  # tailscaled's own built-in Web/Proxy serve mode is documented as 5-10x
  # slower under concurrent load (tailscale/tailscale#18307) — confirmed
  # tonight as an accept-then-hang on any response above a trivial size,
  # affecting both the tailnet HTTPS URL and the "direct" published port.
  # Caddy does the actual HTTP-level reverse proxying instead; see
  # pihole/Caddyfile for the identical, already-working pattern.
  caddy-sidecar:
    image: caddy:2-alpine
    container_name: caddy-portainer

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale-sidecar
      - portainer

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar  # Share tailscale-sidecar's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/portainer/caddy-config:/etc/caddy:ro

  # ── Identity ──────────────────────────────────────────────
  tailscale-sidecar:
    image: tailscale/tailscale:unstable
    container_name: ts-portainer

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME_PORTAINER:-portainer}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      # Force DERP relay — see pihole/docker-compose.yml for the full write-up.
      # This node can negotiate a bogus "direct" path via NAT hairpin off its
      # public STUN endpoint, which passes disco pings but blackholes the
      # multi-segment TLS ServerHello, hanging :443 at the handshake. Portainer
      # hit this twice (2026-08-02 and 08-04); each apparent fix (state wipe,
      # image bump) really just changed the container's UDP port and reshuffled
      # path selection. Pin the relay so it is deterministic, not luck.
      - TS_DEBUG_ALWAYS_USE_DERP=1

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/portainer-secrets/certs:/certs:ro
      - /volume1/docker/portainer-secrets/chisel:/chisel:ro
      - /volume1/docker/stacks/portainer/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/portainer/ts-config:/config

    # ── Network ───────────────────────────────────────────────
    networks:
      - portainer_net

    # ── Runtime ───────────────────────────────────────────────
    ports:
      - "19443:9443"
      - "9000:9000"
      - "8000:8000"

    # ── Storage ───────────────────────────────────────────────
    devices:
      - /dev/net/tun:/dev/net/tun

# Pinned for the same reason as pihole: DSM's firewall only allow-lists
# 172.16.0.0/12 and the real LAN for forwarded traffic, while Docker's dynamic
# pool hands out 192.168.0.0/16 /20 blocks that fall through to default-deny.
# An unpinned network here silently loses all outbound access, which breaks
# GitOps polling and image pulls.
networks:
  portainer_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.21.0/24
