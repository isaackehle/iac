# Portainer — Docker Compose Stack
#
# Stack version: 2.0 (2026-09-26) -- openwebui pattern: sidecar + TCPForward, no Caddy
# Purpose: Docker management interface with Tailscale sidecar
#
# Services:
#   - primary (Portainer CE; plain HTTP on :9000, HTTPS on :9443)
#   - tailscale (Tailscale sidecar; owns the network namespace)
#
# Request path for https://portainer.<tailnet>.ts.net:
#   client -> portainer-tailscale :443 (TerminateTLS) -> TCPForward 127.0.0.1:9000
# Same shape as openwebui. TCPForward is a raw TCP relay, not tailscaled's
# Web/Proxy HTTP code path (tailscale/tailscale#18307), so no Caddy hop needed.
#
# Environment variables:
#   - TS_HOSTNAME=${TS_HOSTNAME:-portainer}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down
#   Never restart the sidecar alone -- see INSTALLATION.md "Updates".
#

name: portainer

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: portainer/portainer-ce:latest
    container_name: portainer

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale
    command: ["--trusted-origins=${TS_CERT_DOMAIN}"]

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale
    security_opt:
      - no-new-privileges:true

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/stacks/portainer/data:/data

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: portainer-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/portainer/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/portainer/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME:-portainer}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      # Force DERP relay — see pihole/docker-compose.yml for the full write-up.
      # This node can negotiate a bogus "direct" path via NAT hairpin off its
      # public STUN endpoint, which passes disco pings but blackholes the
      # multi-segment TLS ServerHello, hanging :443 at the handshake. Portainer
      # hit this twice (2026-08-02 and 08-04).
      - TS_DEBUG_ALWAYS_USE_DERP=1

    # ── Network ───────────────────────────────────────────────
    # Published here, not on primary: primary has no network of its own.
    networks:
      - portainer_net
    ports:
      - "9000:9000"     # Portainer HTTP (LAN)
      - "19443:9443"    # Portainer HTTPS, self-signed (LAN)
      - "8000:8000"     # Portainer Edge agent tunnel

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

# Pinned: DSM's firewall only allow-lists 172.16.0.0/12 and the real LAN for
# forwarded traffic, while Docker's dynamic pool hands out 192.168.0.0/16 /20
# blocks that fall through to default-deny. An unpinned network silently loses
# all outbound access (seen 2026-09-26: portainer_default got 192.168.112.0/20
# and the sidecar logged "UDP is blocked" + ACME timeouts). Name kept as
# portainer_net so the existing portainer_portainer_net network is reused.
networks:
  portainer_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.21.0/24
