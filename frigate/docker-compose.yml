# Frigate — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: NVR for IP cameras with object detection
#
# Services:
#   - primary
#
# Environment variables:
#   - STACK_NAME=Frigate
#   - FRIGATE_MQTT_HOST=${FRIGATE_MQTT_HOST}
#   - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER}
#   - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
#   - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER}
#   - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f frigate.yaml up -d
#   docker compose -f frigate.yaml down
#
name: frigate

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/blakeblackshear/frigate:0.16.4
    # Pinned deliberately, not `:stable` — see CLAUDE.md re: floating tags on
    # fast-moving GitOps-deployed stacks. Check current release before you
    # pin: https://github.com/blakeblackshear/frigate/releases
    container_name: frigate

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    stop_grace_period: 30s

    # ── Network ───────────────────────────────────────────────
    ports:
      - "8971:8971"         # Web UI (HTTP API + dashboard)
      - "8554:8554"         # RTSP restream (re-stream camera feeds)
      - "8555:8555/tcp"     # WebRTC over TCP (low-latency live view)
      - "8555:8555/udp"     # WebRTC over UDP (preferred for live view)

    # ── Storage ───────────────────────────────────────────────
    volumes:
      # Persistent data (recordings, snapshots, clips)
      - ./storage:/media/frigate
      # Application config (frigate.yml, database)
      - ./config:/config
      # Ephemeral cache (tmpfs for performance)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    # ── Environment ───────────────────────────────────────────
    environment:
      - FRIGATE_MQTT_HOST=${FRIGATE_MQTT_HOST}
      - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}

    # ── Runtime ───────────────────────────────────────────────
    shm_size: "1gb"         # Shared memory for camera streams
