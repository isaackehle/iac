# n8n — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Workflow automation platform
#
# Services:
#   - primary
#   - browserless
#   - tailscale (Tailscale sidecar)
#
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f n8n.yaml up -d
#   docker compose -f n8n.yaml down
#
# Networking (Pattern B inverted — primary owns namespace):
#   The primary owns the network namespace and joins n8n-net,
#   allowing it to resolve browserless by name. The tailscale
#   borrows the primary's namespace (network_mode: service:primary),
#   so the sidecar's serve.json can proxy to the app over 127.0.0.1.
#

name: n8n

x-stack-env: &stack-env
  - /volume1/docker/stacks/config/global.env
  - /volume1/docker/stacks/config/n8n/service.env

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: n8nio/n8n:latest
    container_name: n8n
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "5678:5678"                 # n8n web UI
    hostname: n8n
    networks:
      - n8n-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/n8n/config:/home/node/.n8n
      - /volume1/docker/stacks/n8n/files:/files

  # ── Identity ──────────────────────────────────────────────
  browserless:
    image: browserless/chrome:latest
    container_name: n8n-browserless
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - n8n-net

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    env_file: *stack-env
    container_name: n8n-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    network_mode: service:primary   # Share the primary's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/n8n/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/n8n/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      TS_HOSTNAME: n8n
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
networks:
  n8n-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.29.0/24
