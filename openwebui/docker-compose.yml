services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    depends_on:
    - openwebui-ts
    network_mode: service:openwebui-ts
    volumes:
    - /volume1/docker/stacks/openwebui/data:/app/backend/data
    environment:
    - TZ=${TZ}
  openwebui-config:
    image: alpine:3.20
    container_name: openwebui-config
    restart: 'no'
    volumes:
    - ./configure-ollama.sh:/scripts/configure-ollama.sh:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - OPENWEBUI_API_URL=${OPENWEBUI_API_URL:-http://localhost:8080}
    - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:?Set this to your admin API key}
    - OLLAMA_ENGINES=${OLLAMA_ENGINES:-'[]'}
    command: "sh -c \"chmod +x /scripts/configure-ollama.sh && \n       timeout 30\
      \ /bin/sh -c 'until curl -sf ${OPENWEBUI_API_URL}/api/models >/dev/null 2>&1;\
      \ do sleep 2; done' &&\n       /scripts/configure-ollama.sh\"\n"
  openwebui-ts:
    image: tailscale/tailscale:latest
    container_name: openwebui-ts
    restart: unless-stopped
    volumes:
    - /volume1/docker/stacks/openwebui/ts-state:/var/lib/tailscale
    - /volume1/docker/stacks/openwebui/ts-config:/config
    environment:
    - TS_HOSTNAME=openwebui
    - TS_AUTHKEY=${TS_AUTHKEY}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_AUTH_ONCE=true
    - TS_SERVE_CONFIG=/config/serve.json
    cap_add:
    - NET_ADMIN
    - NET_RAW
    devices:
    - /dev/net/tun:/dev/net/tun
