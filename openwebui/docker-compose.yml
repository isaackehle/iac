# OpenWebUI — Docker Compose Stack
#
# Stack version: 2.0 (2026-09-25) -- LiteLLM backends, no Ollama (homelab DEC-180/185)
# Purpose: Web UI for LLM interaction. Backends are each fleet host's LiteLLM
#   gateway, registered as OpenAI-compatible connections by configure-litellm.sh
#   (never Ollama -- see that repo's DEC-180/185).
#
# Services:
#   - primary
#   - config (runs configure-litellm.sh once; safe/idempotent to re-run;
#     no-ops with instructions if OPENWEBUI_API_KEY isn't set yet)
#   - tailscale (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=OpenWebUI
#   - TZ=${TZ}
#   - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}  (optional at first deploy -- see
#     configure-litellm.sh; required only to actually register connections)
#   - LITELLM_ENGINES=${LITELLM_ENGINES}  (JSON array of fleet hosts' LiteLLM
#     URLs -- see homelab repo fleet/registry/hosts.yaml for the current list)
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down
#

name: openwebui

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/openwebui/data:/app/backend/data

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}

  # ── Identity ──────────────────────────────────────────────
  config:
    image: alpine:3.20
    container_name: openwebui-config

    # ── Lifecycle ─────────────────────────────────────────────
    restart: "no"
    depends_on:
      - primary

    # ── Storage ───────────────────────────────────────────────
    volumes:
      # Absolute, not ./: Portainer CE runs compose inside its own container, so a
      # relative bind source resolves to a path that doesn't exist on the NAS
      # and Docker mounts an empty directory. deploy.sh copies the script here.
      - /volume1/docker/stacks/openwebui/configure-litellm.sh:/scripts/configure-litellm.sh:ro

    # ── Environment ───────────────────────────────────────────
    # OPENWEBUI_API_KEY intentionally has no ${VAR:?...} guard: it doesn't
    # exist until an admin account is created once via the web UI (see
    # configure-litellm.sh), so it must not block `primary`/`tailscale` from
    # coming up on a fresh deploy.
    environment:
      # primary uses network_mode: service:tailscale (shares that container's
      # network namespace, has no IP/DNS entry of its own on openwebui_default),
      # so it's reached from "config" via the tailscale service's own DNS name.
      - OPENWEBUI_API_URL=http://tailscale:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      - LITELLM_ENGINES=${LITELLM_ENGINES:-'[]'}

    # ── Runtime ───────────────────────────────────────────────
    command: "sh -c \"apk add --no-cache bash python3 curl >/dev/null && timeout 180 /bin/sh -c 'until curl -sf $$OPENWEBUI_API_URL/health >/dev/null 2>&1; do sleep 2; done' && bash /scripts/configure-litellm.sh\""

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: openwebui-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/openwebui/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/openwebui/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=openwebui
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

# Pinned, same reason as pihole/portainer: DSM's firewall drops forwarded
# traffic from Docker's default 192.168.x.0/20 pool, which kills outbound
# (image pulls, DERP, ACME). A Portainer redeploy recreates this network, so
# it must not be left to chance.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.22.0/24
