# OpenWebUI — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Web UI for LLM interaction with Ollama integration
#
# Services:
#   - primary
#   - config
#   - tailscale-sidecar (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=OpenWebUI
#   - TZ=${TZ}
#   - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f openwebui.yaml up -d
#   docker compose -f openwebui.yaml down
#

name: openwebui

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale-sidecar

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/openwebui/data:/app/backend/data

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}

  # ── Identity ──────────────────────────────────────────────
  config:
    image: alpine:3.20
    container_name: openwebui-config

    # ── Lifecycle ─────────────────────────────────────────────
    restart: "no"
    depends_on:
      - primary

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ./configure-ollama.sh:/scripts/configure-ollama.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # ── Environment ───────────────────────────────────────────
    environment:
      - OPENWEBUI_API_URL=${OPENWEBUI_API_URL:-http://localhost:8080}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:?Set this to your admin API key}
      - OLLAMA_ENGINES=${OLLAMA_ENGINES:-'[]'}

    # ── Runtime ───────────────────────────────────────────────
    command: "sh -c \"chmod +x /scripts/configure-ollama.sh && timeout 30 /bin/sh -c 'until curl -sf ${OPENWEBUI_API_URL}/api/models >/dev/null 2>&1; do sleep 2; done' && /scripts/configure-ollama.sh\""

  # ── Identity ──────────────────────────────────────────────
  tailscale-sidecar:
    image: tailscale/tailscale:latest
    container_name: ts-openwebui

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/openwebui/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/openwebui/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=openwebui
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
