# Template Stack — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Containerized template service(s)
#
# Services:
#   - template
#   - ts-template (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=Template
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f template.yaml up -d
#   docker compose -f template.yaml down
#

name: template
version: "3.8"

services:
  # ── Identity ──────────────────────────────────────────────
  template:
    image: your-image:latest
    container_name: template

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - ts-template

    # ── Network ───────────────────────────────────────────────
    # ports:
    #   - "8080:8080"

    # ── Storage ───────────────────────────────────────────────
    # volumes:
    #   - ./data:/data

    # ── Environment ───────────────────────────────────────────
    # environment:
    #   - KEY=value

    # ── Runtime ───────────────────────────────────────────────
    # shm_size: "1gb"

  # ── Identity ──────────────────────────────────────────────
  ts-template:
    image: tailscale/tailscale:latest
    container_name: ts-template

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=template
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
