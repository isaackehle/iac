# Template Stack — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Containerized template service(s)
#
# Services:
#   - primary
#   - tailscale (Tailscale sidecar)
#
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f template.yaml up -d
#   docker compose -f template.yaml down
#

name: template

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: your-image:latest
    container_name: template

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    # ports:
    #   - "8080:8080"

    # ── Storage ───────────────────────────────────────────────
    # volumes:
    #   - ./data:/data

    # ── Environment ───────────────────────────────────────────
    # environment:
    #   - KEY=value

    # ── Runtime ───────────────────────────────────────────────
    # shm_size: "1gb"

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: template-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/_template/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/_template/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      TS_HOSTNAME: _template
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
