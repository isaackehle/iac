# Observability — Docker Compose Stack
#
# Stack version: 1.0 (2026-10-18)
# Purpose: metrics, logs, uptime probes and Telegram alerts for the homelab.
#   Plan: ~/Documents/Projects/Homelab/Plans/2026-10-18-homelab-observability.md
#   Grafana        https://obs.${TS_TAILNET_DOMAIN}
#   Prometheus     https://obs.${TS_TAILNET_DOMAIN}:9090   (also the remote_write target for fleet Alloy agents)
#   Alertmanager   https://obs.${TS_TAILNET_DOMAIN}:9093
#   Loki           https://obs.${TS_TAILNET_DOMAIN}:3100   (log push target for fleet Alloy agents)
#
# Services:
#   - tailscale       sidecar, tailnet node "obs"; owns the network namespace
#   - prometheus      borrows the sidecar netns; scrapes, evaluates prometheus/rules/
#   - alertmanager    borrows the sidecar netns; sends to Telegram
#   - loki            borrows the sidecar netns; ruler evaluates loki/rules/
#   - grafana         borrows the sidecar netns
#   - alloy           borrows the sidecar netns; ships Docker + DSM + boot-guard logs to Loki
#   - blackbox        borrows the sidecar netns; probes tailnet URLs, DSM, HA
#   - snmp            borrows the sidecar netns; Synology RAID/disk/temperature over SNMP
#   - cadvisor        on the stack bridge at a fixed IP; per-container CPU/memory
#   - node-exporter   host network; NAS host metrics + the docker-state textfile
#   - docker-state    no network; lists ALL containers (stopped ones too) every 30s
#   - laptop-probe    borrows the sidecar netns; LiteLLM on the sleeping laptops
#                     (discovery, enterprise), asleep-aware, via the textfile
#
# Why the netns borrowers: everything that talks to the tailnet (blackbox
# probing *.ts.net through the proxy below, Prometheus/Loki receiving pushes)
# shares the sidecar's namespace. Every borrower listens on 127.0.0.1 only; the tailnet sees only the
# TLS ports in serve.json. Prometheus, Alertmanager and Loki have no login: tailnet
# membership is the access control. Grafana has an admin password.
#
# Tailnet egress: like every sidecar here, tailscaled runs in userspace mode
# (containerboot's default), so the namespace has no tailscale0 route and no
# MagicDNS. Anything that must reach a *.ts.net URL (blackbox) goes through
# tailscaled's outbound HTTP proxy on 127.0.0.1:1055, which dials over the
# tailnet and resolves MagicDNS itself. Everything else (Telegram, LAN, images)
# uses the bridge. Inbound from the tailnet is serve.json as usual.
#
# Non-root services run as OBS_PUID:OBS_PGID (isaac, 1026:100), not their image
# uids: since the 2026-10-17 docker share ACL change a non-root uid only reaches
# files it owns, and deploy.sh pushes config files as the SSH user. Running as
# that user keeps every pushed file readable without STACK_CHOWN_OVERRIDES.
#
# Environment variables: see .env.example
#
# Deployment: see INSTALLATION.md (config files are pushed by deploy.sh; the
#   stack itself is a Portainer git stack).
#

name: observability

services:
  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: obs-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/observability/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=obs
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=127.0.0.1:1055
      # Force DERP relay — see portainer/docker-compose.yml for the full write-up.
      - TS_DEBUG_ALWAYS_USE_DERP=1

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── Identity ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: obs-prometheus

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/prometheus:/etc/prometheus:ro
      - /volume1/docker/stacks/observability/data/prometheus:/prometheus

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=127.0.0.1:9090
      - --web.external-url=https://${OBS_HOST}:9090
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle

  # ── Identity ──────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: obs-alertmanager

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/alertmanager:/etc/alertmanager:ro
      - /volume1/docker/stacks/observability/data/alertmanager:/alertmanager

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --web.external-url=https://${OBS_HOST}:9093
      - --cluster.listen-address=

  # ── Identity ──────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.8
    container_name: obs-loki

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/loki:/etc/loki:ro
      - /volume1/docker/stacks/observability/data/loki:/loki

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - -config.file=/etc/loki/loki.yml

  # ── Identity ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.3
    container_name: obs-grafana

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/data/grafana:/var/lib/grafana
      - /volume1/docker/stacks/observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - /volume1/docker/stacks/observability/config/grafana/dashboards:/etc/grafana/dashboards:ro

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://${OBS_HOST}/
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"

  # ── Identity ──────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: obs-alloy

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    # Runs as root: it needs the Docker socket (read-only mount does not make the
    # API read-only; Alloy only lists containers and reads logs) and
    # /var/log/messages, which is 0660 system:log.
    volumes:
      - /volume1/docker/stacks/observability/config/alloy:/etc/alloy:ro
      - /volume1/docker/stacks/observability/data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host/var/log:ro

    # ── Runtime ───────────────────────────────────────────────
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy

  # ── Identity ──────────────────────────────────────────────
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: obs-blackbox

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/blackbox:/etc/blackbox:ro

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115

  # ── Identity ──────────────────────────────────────────────
  snmp:
    image: prom/snmp-exporter:v0.30.1
    container_name: obs-snmp

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/snmp:/etc/snmp-auth:ro

    # ── Runtime ───────────────────────────────────────────────
    # The image's own snmp.yml carries the "synology" module; ours adds only the auth.
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp-auth/auth.yml
      - --web.listen-address=127.0.0.1:9116

  # ── Identity ──────────────────────────────────────────────
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: obs-cadvisor

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    # Fixed IP so Prometheus (in the sidecar netns) needs no Docker DNS to find it.
    networks:
      default:
        ipv4_address: 172.20.35.10

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume1/@docker:/var/lib/docker:ro
      # no /dev/disk mount: it does not exist on DSM

    # ── Runtime ───────────────────────────────────────────────
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp

  # ── Identity ──────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: obs-node-exporter

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    # Host network so interface stats are the NAS's own. Listens on :9100 on every
    # NAS interface (read-only metrics); Prometheus scrapes it via the stack
    # bridge gateway 172.20.35.1. Not the sidecar pattern, so rule 3 does not apply.
    network_mode: host
    pid: host

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /:/host:ro   # no rslave: DSM's / is not a shared mount (compose up fails)
      - /volume1/docker/stacks/observability/textfile:/textfile:ro

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|volume1/@docker/.+|var/lib/docker/.+)($$|/)

  # ── Identity ──────────────────────────────────────────────
  docker-state:
    image: docker:24.0.9-cli
    container_name: obs-docker-state

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    network_mode: none

    # ── Storage ───────────────────────────────────────────────
    # Root: Docker socket plus @docker/containers/*/config.v2.json, where the
    # "stopped by hand" flag lives (same rule as scripts/docker-boot-guard.sh).
    volumes:
      - /volume1/docker/stacks/observability/config/docker-state:/opt/docker-state:ro
      - /volume1/docker/stacks/observability/textfile:/textfile
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volume1/@docker/containers:/docker-containers:ro

    # ── Runtime ───────────────────────────────────────────────
    entrypoint: ["/bin/sh", "/opt/docker-state/docker-state.sh"]

  # ── Identity ──────────────────────────────────────────────
  laptop-probe:
    image: curlimages/curl:8.10.1
    container_name: obs-laptop-probe

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    # Borrows the sidecar netns for tailscaled's outbound proxy (127.0.0.1:1055),
    # same as blackbox. Nothing listens; results go out via the textfile.
    network_mode: service:tailscale

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/observability/config/laptop-probe:/opt/laptop-probe:ro
      - /volume1/docker/stacks/observability/textfile:/textfile

    # ── Environment ───────────────────────────────────────────
    # The tailnet domain comes from config/laptop-probe/laptop-probe.conf
    # (rendered from laptop-probe.conf.tmpl, pushed by deploy.sh extras), not
    # from a stack variable, so a git redeploy needs no new Portainer variable.
    environment:
      - LAPTOPS=discovery enterprise

    # ── Runtime ───────────────────────────────────────────────
    user: "${OBS_PUID}:${OBS_PGID}"
    entrypoint: ["/bin/sh", "/opt/laptop-probe/laptop-probe.sh"]

# Pinned, same reason as pihole/portainer/openwebui: DSM's firewall drops
# forwarded traffic from Docker's default 192.168.x.0/20 pool, which kills
# outbound (image pulls, DERP, ACME, Telegram).
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.35.0/24
          gateway: 172.20.35.1
