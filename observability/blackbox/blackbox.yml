# blackbox_exporter modules for the observability stack (see prometheus.yml.tmpl).
modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true

  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4

  https_insecure:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: true
