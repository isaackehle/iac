# NAS host alerts: node-exporter (instance="nas") and Synology SNMP.
# SNMP metric names come from snmp_exporter's synology module (SYNOLOGY-*-MIB);
# if SNMP is off these rules have no data and stay silent (SnmpDown says so).
groups:
  - name: nas-host
    rules:
      - alert: NasVolumeFilling
        expr: 100 * (1 - node_filesystem_avail_bytes{instance="nas",mountpoint="/volume1"} / node_filesystem_size_bytes{instance="nas",mountpoint="/volume1"}) > 85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "/volume1 is {{ $value | printf \"%.0f\" }}% full"

      - alert: NasVolumeFull
        expr: 100 * (1 - node_filesystem_avail_bytes{instance="nas",mountpoint="/volume1"} / node_filesystem_size_bytes{instance="nas",mountpoint="/volume1"}) > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "/volume1 is {{ $value | printf \"%.0f\" }}% full"

      - alert: NasMemoryLow
        expr: node_memory_MemAvailable_bytes{instance="nas"} / node_memory_MemTotal_bytes{instance="nas"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS has under 10% memory available"

      - alert: NasRebooted
        expr: changes(node_boot_time_seconds{instance="nas"}[30m]) > 0
        labels:
          severity: info
        annotations:
          summary: "NAS rebooted in the last 30 min"

  - name: synology
    rules:
      # raidStatus: 1 Normal ... 11 Degrade, 12 Crashed
      - alert: SynologyRaidDegraded
        expr: raidStatus == 11 or raidStatus == 12
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Synology RAID {{ $labels.raidName }} is degraded or crashed (status {{ $value }})"

      # diskStatus: 1 Normal, 2 Initialized, 3 NotInitialized, 4 SystemPartitionFailed, 5 Crashed
      - alert: SynologyDiskFailing
        expr: diskStatus >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Synology disk {{ $labels.diskID }} status {{ $value }} (not normal)"

      - alert: SynologyDiskHot
        expr: diskTemperature > 55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Synology disk {{ $labels.diskID }} at {{ $value }} °C"

      # 1 = Normal for each of these
      - alert: SynologySystemNotNormal
        expr: systemStatus != 1 or powerStatus != 1 or systemFanStatus != 1 or cpuFanStatus != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Synology system, power or fan status is not normal"

      - alert: SnmpDown
        expr: up{job="snmp"} == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "SNMP scrape of the NAS failing: RAID/disk alerts have no data (is SNMP enabled in DSM?)"
