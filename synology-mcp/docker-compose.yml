# Synology MCP — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Model Context Protocol server for Synology NAS integration
#
# Services:
#   - primary
#
# Environment variables:
#   - STACK_NAME=SynologyMCP
#   - SYNOLOGY_HOST=${SYNOLOGY_HOST}
#   - SYNOLOGY_PORT=${SYNOLOGY_PORT}
#   - SYNOLOGY_SSL=${SYNOLOGY_SSL}
#   - SYNOLOGY_USERNAME=${SYNOLOGY_USERNAME}
#   - SYNOLOGY_PASSWORD=${SYNOLOGY_PASSWORD}
#   - SYNOLOGY_OTP_CODE=${SYNOLOGY_OTP_CODE}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f synology-mcp.yaml up -d
#   docker compose -f synology-mcp.yaml down
#

name: synologymcp

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/lefty3382/synology-mcp:latest
    container_name: synology-mcp

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "8485:8485"
    networks:
      - synology_mcp_net

    # ── Environment ───────────────────────────────────────────
    environment:
      - SYNOLOGY_TANK_HOST=${SYNOLOGY_HOST}
      - SYNOLOGY_TANK_PORT=${SYNOLOGY_PORT}
      - SYNOLOGY_TANK_USERNAME=${SYNOLOGY_USERNAME}
      - SYNOLOGY_TANK_PASSWORD=${SYNOLOGY_PASSWORD}
      - MCP_PORT=8485
      - MCP_PERMISSION_TIER=health

networks:
  synology_mcp_net:
    driver: bridge
