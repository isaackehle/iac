# Pi-hole — Docker Compose Stack
#
# Stack version: 2.1 (2026-11-07) -- openwebui pattern: TCPForward straight to :80, no Caddy
# Purpose: DNS sinkhole for ad blocking with DHCP server
#
# Services:
#   - primary (Pi-hole; DNS sinkhole + DHCP + web admin)
#   - tailscale (Tailscale sidecar; owns the network namespace)
#
#   See .env.sample for all required variables
#
# Deployment:
#   docker compose -f pihole.yaml up -d
#   docker compose -f pihole.yaml down
#   Never restart the sidecar alone -- see INSTALLATION.md "Updates".
#

name: pihole

x-stack-env: &stack-env
  - /volume1/docker/stacks/config/global.env
  - /volume1/docker/stacks/config/pihole/service.env

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: pihole/pihole:latest
    env_file: *stack-env
    container_name: pihole

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "53:53/tcp"                 # DNS over TCP — large responses and zone transfers
      - "53:53/udp"                 # DNS over UDP — standard query protocol
      - "8280:80/tcp"               # Web admin interface (remapped to avoid port 80)
    hostname: pihole

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/pihole/etc-pihole:/etc/pihole

    # ── Environment ───────────────────────────────────────────
    # Restored 2026-11-10: dropped by mistake in 52a76a1, which moved
    # secrets to env files but deleted these non-secret settings too.
    environment:
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAMS}"
      FTLCONF_webserver_port: 80
      FTLCONF_webserver_domain: "${TS_CERT_DOMAIN}"

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    env_file: *stack-env
    container_name: pihole-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    network_mode: service:primary  # Share Pi-hole's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/pihole/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/pihole/ts-config:/config

    # ── Environment (sidecar-only overrides) ──────────────────
    environment:
      TS_HOSTNAME: pihole
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      # Force DERP relay. This node otherwise negotiates a bogus "direct" path
      # (my LAN peer sees it at 192.168.10.108 — a different physical host) via
      # NAT hairpin off the container's public STUN endpoint. That path passes
      # disco pings, which are fragmentable UDP, but silently blackholes the
      # DF-set WireGuard data packets carrying a multi-segment TLS ServerHello,
      # so :443 connects and then hangs forever at the handshake. Relaying costs
      # ~30ms and is irrelevant for an admin UI.
      # Note: switched from tailscale:unstable to :latest (2026-11-07) after
      # the unstable tag broke. See portainer/docker-compose.yml for rationale.
      TS_DEBUG_ALWAYS_USE_DERP: 1
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN}

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

# DSM's firewall only allow-lists 172.16.0.0/12 and the real LAN (192.168.10.0/22)
# for forwarded traffic. Docker's dynamic address-pool allocates new bridge
# networks from 192.168.0.0/16 in /20 blocks, which overlaps the LAN and isn't
# covered by any allow rule, so an unpinned network falls through to DSM's
# default-deny and the container loses all outbound connectivity. Pin to an
# unused /24 inside the already-allowed 172.16.0.0/12 range instead.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.20.0/24
