# Pi-hole — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: DNS sinkhole for ad blocking with DHCP server
#
# Services:
#   - primary
#   - caddy (Reverse proxy with HTTPS)
#   - tailscale (Tailscale sidecar)
#
# Environment variables:
#   - STACK_NAME=PiHole
#   - TZ=${TZ}
#   - PIHOLE_PASSWORD=${PIHOLE_PASSWORD}
#   - PIHOLE_UPSTREAMS=${PIHOLE_UPSTREAMS}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f pihole.yaml up -d
#   docker compose -f pihole.yaml down
#

name: pihole

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: pihole/pihole:latest
    container_name: pihole

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "53:53/tcp"                 # DNS over TCP — large responses and zone transfers
      - "53:53/udp"                 # DNS over UDP — standard query protocol
      - "8280:80/tcp"               # Web admin interface (remapped to avoid port 80)
    hostname: pihole

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/pihole/etc-pihole:/etc/pihole

    # ── Environment ───────────────────────────────────────────
    environment:
      - TZ=${TZ}                                    # System timezone
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}  # Web admin password
      - FTLCONF_dns_listeningMode=all               # Listen on all interfaces
      - FTLCONF_dns_upstreams=${PIHOLE_UPSTREAMS}   # Upstream DNS resolvers
      - FTLCONF_webserver_port=80                   # Internal web UI port
      - FTLCONF_webserver_domain=${TS_CERT_DOMAIN}  # Domain for HTTPS

  # ── Identity ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: pihole-caddy

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    network_mode: service:primary  # Share Pi-hole's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/pihole/caddy-config:/etc/caddy:ro

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:unstable
    container_name: pihole-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    network_mode: service:primary  # Share Pi-hole's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/pihole/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/pihole/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=pihole
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      # Force DERP relay. This node otherwise negotiates a bogus "direct" path
      # (my LAN peer sees it at 192.168.68.108 — a different physical host) via
      # NAT hairpin off the container's public STUN endpoint. That path passes
      # disco pings, which are fragmentable UDP, but silently blackholes the
      # DF-set WireGuard data packets carrying a multi-segment TLS ServerHello,
      # so :443 connects and then hangs forever at the handshake. Relaying costs
      # ~30ms and is irrelevant for an admin UI.
      - TS_DEBUG_ALWAYS_USE_DERP=1
      - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

# DSM's firewall only allow-lists 172.16.0.0/12 and the real LAN (192.168.68.0/22)
# for forwarded traffic. Docker's dynamic address-pool allocates new bridge
# networks from 192.168.0.0/16 in /20 blocks, which overlaps the LAN and isn't
# covered by any allow rule, so an unpinned network falls through to DSM's
# default-deny and the container loses all outbound connectivity. Pin to an
# unused /24 inside the already-allowed 172.16.0.0/12 range instead.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.20.0/24
