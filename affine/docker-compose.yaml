name: affine
services:
  # ---------------------------------------------------------------------------
  # Main application — Affine collaborative whiteboard platform
  # ---------------------------------------------------------------------------
  affine:
    # 1. Identity
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}  # Affine server container
    container_name: affine_server  # Server container name

    # 2. Lifecycle
    restart: unless-stopped  # Auto-restart on failure or Docker restart
    depends_on:
      redis:
        condition: service_healthy  # Wait for Redis to be healthy
      postgres:
        condition: service_healthy  # Wait for PostgreSQL to be healthy
      affine_migration:
        condition: service_completed_successfully  # Wait for DB migrations to complete

    # 3. Network
    ports:
      - ${PORT:-3010}:3010  # Web UI port (default 3010)

    # 4. Storage
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage  # User uploads directory
      - ${CONFIG_LOCATION}:/root/.affine/config  # Application config

    # 5. Environment
    environment:
      - REDIS_SERVER_HOST=redis  # Redis service hostname
      - DATABASE_URL=postgresql://${DB_USERNAME}:***@postgres:5432/${DB_DATABASE:-affine}  # DB connection string
      - AFFINE_INDEXER_ENABLED=false  # Disable search indexer (optional)

  # ---------------------------------------------------------------------------
  # Migration job — runs database migrations on startup
  # ---------------------------------------------------------------------------
  affine_migration:
    # 1. Identity
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}  # Same image as server
    container_name: affine_migration_job  # Migration job container

    # 2. Lifecycle
    depends_on:
      postgres:
        condition: service_healthy  # Wait for PostgreSQL
      redis:
        condition: service_healthy  # Wait for Redis

    # 4. Storage
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage  # Same uploads as server
      - ${CONFIG_LOCATION}:/root/.affine/config  # Same config as server

    # 5. Environment
    environment:
      - REDIS_SERVER_HOST=redis  # Redis service hostname
      - DATABASE_URL=postgresql://${DB_USERNAME}:***@postgres:5432/${DB_DATABASE:-affine}  # DB connection string
      - AFFINE_INDEXER_ENABLED=false  # Disable search indexer

    # 6. Runtime
    command:
      - sh  # Shell interpreter
      - -c  # Execute command string
      - node ./scripts/self-host-predeploy.js  # Run pre-deployment script

  # ---------------------------------------------------------------------------
  # PostgreSQL database — primary data store
  # ---------------------------------------------------------------------------
  postgres:
    # 1. Identity
    image: pgvector/pgvector:pg16  # PostgreSQL with pgvector extension for AI features
    container_name: affine_postgres  # Database container name

    # 2. Lifecycle
    restart: unless-stopped  # Auto-restart on failure

    # 4. Storage
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data  # PostgreSQL data directory

    # 5. Environment
    environment:
      POSTGRES_USER: ${DB_USERNAME}  # Database username
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Database password (use secrets)
      POSTGRES_DB: ${DB_DATABASE:-affine}  # Database name (default: affine)
      POSTGRES_INITDB_ARGS: --data-checksums  # Enable data integrity checksums

    # 6. Runtime
    healthcheck:
      test:
        - CMD  # Execute command
        - pg_isready  # Check PostgreSQL readiness
        - -U  # User flag
        - ${DB_USERNAME}  # Username
        - -d  # Database flag
        - ${DB_DATABASE:-affine}  # Database name
      interval: 10s  # Check every 10 seconds
      timeout: 5s  # Timeout after 5 seconds
      retries: 5  # Max 5 retries before unhealthy

  # ---------------------------------------------------------------------------
  # Redis cache — session and cache storage
  # ---------------------------------------------------------------------------
  redis:
    # 1. Identity
    image: redis  # Official Redis image (latest tag)
    container_name: affine_redis  # Redis container name

    # 2. Lifecycle
    restart: unless-stopped  # Auto-restart on failure

    # 6. Runtime
    healthcheck:
      test:
        - CMD  # Execute command
        - redis-cli  # Redis CLI tool
        - --raw  # Raw output mode
        - incr  # Increment operation (tests write)
        - ping  # Ping command
      interval: 10s  # Check every 10 seconds
      timeout: 5s  # Timeout after 5 seconds
      retries: 5  # Max 5 retries before unhealthy
