# Affine — Docker Compose Stack
#
# Stack version: 2.0 (2026-09-26) -- Tailscale sidecar (was host-level serve)
# Purpose: Collaborative whiteboard and note-taking platform
#
# Services:
#   - primary (main application)
#   - migration (database migrations)
#   - config (PostgreSQL database)
#   - cache (Redis cache)
#   - tailscale (sidecar; https://affine.<tailnet>.ts.net)
#
#   See .env.sample for all required variables
#
# Deployment:
#   docker compose -f affine.yaml up -d
#   docker compose -f affine.yaml down
#
name: affine

x-stack-env: &stack-env
  - /volume1/docker/stacks/config/global.env
  - /volume1/docker/stacks/config/affine/service.env

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    env_file: *stack-env
    container_name: affine

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    network_mode: service:tailscale   # borrow the sidecar's namespace (reaches cache/config through it)
    depends_on:
      tailscale:
        condition: service_started
      cache:
        condition: service_healthy
      config:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # ── Environment (overrides / additions) ───────────────────
    # Not secrets, so they live here, not in .env. Without REDIS_SERVER_HOST
    # AFFiNE dials 127.0.0.1:6379, which is nothing in this namespace
    # (ECONNREFUSED on every queue worker). Dropped by mistake in 52a76a1.
    environment:
      REDIS_SERVER_HOST: cache
      INDEXER_ENABLED: "false"

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

  # ── Identity ──────────────────────────────────────────────
  migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    env_file: *stack-env
    container_name: affine_migration_job

    # ── Lifecycle ─────────────────────────────────────────────
    depends_on:
      config:
        condition: service_healthy
      cache:
        condition: service_healthy

    # ── Environment (overrides / additions) ───────────────────
    environment:
      REDIS_SERVER_HOST: cache
      INDEXER_ENABLED: "false"

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

    # ── Runtime ───────────────────────────────────────────────
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js

  # ── Identity ──────────────────────────────────────────────
  config:
    image: pgvector/pgvector:pg16
    env_file: *stack-env
    container_name: affine_postgres

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    user: "1026:100"

    # ── Environment (overrides / additions) ───────────────────
    # Only read when the data directory is empty (first init); restored after
    # 52a76a1 dropped them, so a rebuild from scratch still creates the database.
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: --data-checksums

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  cache:
    image: redis
    container_name: affine_redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  # Tailscale sidecar: joins the tailnet as "affine" and owns the network
  # namespace. primary borrows it (network_mode: service:tailscale), so any
  # LAN ports are published here, not on primary. serve.json (rendered from
  # serve.json.tmpl by scripts/deploy.sh env) terminates TLS with Tailscale's
  # cert and forwards raw TCP (the openwebui pattern, docs/tailscale_patterns.md).
  # primary still reaches cache/config by service name: the sidecar joins the default network.
  tailscale:
    image: tailscale/tailscale:latest
    env_file: *stack-env
    container_name: affine-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Environment ───────────────────────────────────────────
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json

    # ── Network ───────────────────────────────────────────────
    ports:
      - "${PORT:-3010}:3010"      # Web UI port (default 3010)

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/affine/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/affine/ts-config:/config

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.24.0/24
