# Affine — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Collaborative whiteboard and note-taking platform
#
# Services:
#   - affine (main application)
#   - affine_migration (database migrations)
#   - postgres (PostgreSQL database)
#   - redis (Redis cache)
#
# Environment variables:
#   - STACK_NAME=Affine
#   - AFFINE_REVISION=${AFFINE_REVISION:-stable}
#   - PORT=${PORT:-3010}
#   - UPLOAD_LOCATION=${UPLOAD_LOCATION}
#   - CONFIG_LOCATION=${CONFIG_LOCATION}
#   - DB_USERNAME=${DB_USERNAME}
#   - DB_PASSWORD=${DB_PASSWORD}
#   - DB_DATABASE=${DB_DATABASE:-affine}
#   - DB_DATA_LOCATION=${DB_DATA_LOCATION}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f affine.yaml up -d
#   docker compose -f affine.yaml down
#
name: affine

services:
  # ── Identity ──────────────────────────────────────────────
  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_server

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully

    # ── Network ───────────────────────────────────────────────
    ports:
      - "${PORT:-3010}:3010"      # Web UI port (default 3010)

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false

  # ── Identity ──────────────────────────────────────────────
  affine_migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_migration_job

    # ── Lifecycle ─────────────────────────────────────────────
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false

    # ── Runtime ───────────────────────────────────────────────
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js

  # ── Identity ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data

    # ── Environment ───────────────────────────────────────────
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE:-affine}
      - POSTGRES_INITDB_ARGS=--data-checksums

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  redis:
    image: redis
    container_name: affine_redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
