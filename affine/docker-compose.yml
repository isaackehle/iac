# Affine — Docker Compose Stack
#
# Stack version: 2.0 (2026-09-26) -- Tailscale sidecar (was host-level serve)
# Purpose: Collaborative whiteboard and note-taking platform
#
# Services:
#   - primary (main application)
#   - migration (database migrations)
#   - config (PostgreSQL database)
#   - cache (Redis cache)
#   - tailscale (sidecar; https://affine.<tailnet>.ts.net)
#
# Environment variables:
#   - STACK_NAME=Affine
#   - AFFINE_REVISION=${AFFINE_REVISION:-stable}
#   - PORT=${PORT:-3010}
#   - UPLOAD_LOCATION=${UPLOAD_LOCATION}
#   - CONFIG_LOCATION=${CONFIG_LOCATION}
#   - DB_USERNAME=${DB_USERNAME}
#   - DB_PASSWORD=${DB_PASSWORD}
#   - DB_DATABASE=${DB_DATABASE:-affine}
#   - DB_DATA_LOCATION=${DB_DATA_LOCATION}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f affine.yaml up -d
#   docker compose -f affine.yaml down
#
name: affine

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_server

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    network_mode: service:tailscale   # borrow the sidecar's namespace (reaches cache/config through it)
    depends_on:
      tailscale:
        condition: service_started
      cache:
        condition: service_healthy
      config:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    # ── Network ───────────────────────────────────────────────

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - REDIS_SERVER_HOST=cache
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false

  # ── Identity ──────────────────────────────────────────────
  migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_migration_job

    # ── Lifecycle ─────────────────────────────────────────────
    depends_on:
      config:
        condition: service_healthy
      cache:
        condition: service_healthy

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config

    # ── Environment ───────────────────────────────────────────
    environment:
      - REDIS_SERVER_HOST=cache
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false

    # ── Runtime ───────────────────────────────────────────────
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js

  # ── Identity ──────────────────────────────────────────────
  config:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data

    # ── Environment ───────────────────────────────────────────
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE:-affine}
      - POSTGRES_INITDB_ARGS=--data-checksums

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE:-affine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  cache:
    image: redis
    container_name: affine_redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  # Tailscale sidecar: joins the tailnet as "affine" and owns the network
  # namespace. primary borrows it (network_mode: service:tailscale), so any
  # LAN ports are published here, not on primary. serve.json (rendered from
  # serve.json.tmpl by scripts/gen-env.sh) terminates TLS with Tailscale's
  # cert and forwards raw TCP (the openwebui pattern, docs/tailscale_patterns.md).
  # primary still reaches cache/config by service name: the sidecar joins the default network.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: affine-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=affine
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json

    # ── Network ───────────────────────────────────────────────
    ports:
      - "${PORT:-3010}:3010"      # Web UI port (default 3010)

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/affine/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/affine/ts-config:/config

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.24.0/24
