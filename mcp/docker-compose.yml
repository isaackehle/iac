# mcp — MCP servers behind one tailnet name
#
# Stack version: 3.0 (2026-09-26) -- was synology-mcp; now one Tailscale node
#   ("mcp") in front of any number of small MCP server containers, routed by path.
# Purpose: https://mcp.<tailnet>.ts.net/<name>/... reaches the MCP server <name>.
#
# How it works:
#   - `tailscale` joins the tailnet as "mcp" and owns the network namespace.
#   - Every MCP server borrows it (network_mode: service:tailscale), so they all
#     share 127.0.0.1 and each needs its own port (table below).
#   - serve.json (rendered from serve.json.tmpl) terminates TLS with Tailscale's
#     cert and routes by path prefix: /synology -> 127.0.0.1:8485. Tailscale strips
#     the prefix, so https://mcp.<tailnet>.ts.net/synology/mcp reaches the
#     server's own /mcp.
#   - Path routing needs HTTP, so this stack uses Tailscale's Web/Proxy serve mode,
#     not the TCPForward pattern the other stacks use (like `ha`, see
#     docs/tailscale_patterns.md). The slower proxy path doesn't matter for MCP.
#
# Servers (one service each; add a row, a service and a serve.json handler):
#   | Path          | Service         | Port | Image                                  |
#   | /synology     | synology        | 8485 | ghcr.io/lefty3382/synology-mcp:latest  |
#   | /search       | one-search      | 8486 | zacma/one-search-mcp:latest            |
#   | /weather      | weather         | 8487 | node:22-slim + mcp-proxy + weather-mcp |
#   | /tailscale    | tailscale-admin | 8488 | built from servers/tailscale (read-only) |
#   | /time         | time            | 8490 | python:3.12-slim + mcp-proxy + mcp-server-time |
#
# Adding a server: catalog and per-server recipes in ~/code/isaackehle/mcp-servers/README.md
#   (docs/plugin-recipe.md there). In short:
#   - HTTP MCP server (streamable HTTP or SSE): run it on the next free port.
#   - stdio-only MCP server: wrap it with mcp-proxy in server mode, e.g.
#     `mcp-proxy --pass-environment --host 127.0.0.1 --port <port> -- <server command>`.
#     mcp-proxy 0.12 works with mcp 1.28+ (tested 2026-09-27); older mcp-proxy
#     releases needed `mcp<1.20`. Without --pass-environment the server gets no env vars.
#   - Not everything called "tools" is an MCP server: LM Studio plugins (e.g.
#     Beledarians_LM_Studio_Toolbox) run inside LM Studio, not here.
#
#   See .env.example for all required variables
#
# Deployment: scripts/deploy.sh api mcp (Portainer-managed), or
#   scripts/deploy.sh all mcp nas. See INSTALLATION.md.
#

name: mcp

x-stack-env: &stack-env
  - /volume1/docker/stacks/config/global.env
  - /volume1/docker/stacks/config/mcp/service.env

services:
  # ── Identity ──────────────────────────────────────────────
  # Synology DSM tools (health tier). Also still published on the NAS at
  # :8485 (see tailscale.ports) for clients using http://nas.<tailnet>:8485/mcp.
  synology:
    image: ghcr.io/lefty3382/synology-mcp:latest
    container_name: mcp-synology
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale   # borrow the sidecar's namespace

  # ── Identity ──────────────────────────────────────────────
  # Tailscale admin API, read-only (devices, users, policy file, settings).
  # Prefer an OAuth client limited to read scopes over a full API key. Starts
  # without credentials and answers "not configured" rather than crash-looping.
  tailscale-admin:
    build: ./servers/tailscale
    image: mcp-tailscale-admin:local
    container_name: mcp-tailscale-admin
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale   # borrow the sidecar's namespace; port 8488

  # ── Identity ──────────────────────────────────────────────
  # Web search via DuckDuckGo (free, no key needed). For better results:
  # set SEARXNG_URL or TAVILY_API_KEY in .env.
  one-search:
    image: zacma/one-search-mcp:latest
    container_name: mcp-one-search
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Runtime ───────────────────────────────────────
    working_dir: /app
    command:
      - sh
      - -c
      - "npm install -g --prefix /home/pwuser/.local mcp@1.4.2 && export PATH=/home/pwuser/.local/bin:$PATH && npx mcp-proxy --pass-environment --host 127.0.0.1 --port 8486 -- node dist/index.js"

    network_mode: service:tailscale   # borrow the sidecar's namespace; port 8486

    volumes:
      - /volume1/docker/stacks/mcp/.env:/app/.env:ro

  # ── Identity ──────────────────────────────────────
  # Weather data (no API key required).
  # Wrapped with mcp-proxy (stdio → HTTP) so it survives container restart.
  weather:
    image: node:22-slim
    container_name: mcp-weather
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Runtime ───────────────────────────────
    working_dir: /app
    command:
      - sh
      - -c
      - "npm install -g mcp@1.4.2 && npx mcp-proxy --pass-environment --host 127.0.0.1 --port 8487 -- npx @dangahagan/weather-mcp"

    # ── Network ───────────────────────────────
    network_mode: service:tailscale   # borrow the sidecar's namespace; port 8487

  # ── Identity ──────────────────────────────────────
  # Time and timezone queries (Python, no API key required).
  time:
    build: ./servers/time
    container_name: mcp-time
    env_file: *stack-env

    # ── Lifecycle ─────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - tailscale

    # ── Runtime ───────────────────────────────────────
    working_dir: /app
    command:
      - sh
      - -c
      - "pip install mcp-server-time && npx mcp-proxy --pass-environment --host 127.0.0.1 --port 8490 -- python -m mcp_server_time"

    network_mode: service:tailscale   # borrow the sidecar's namespace; port 8490

  # Tailscale node "mcp": owns the namespace every MCP server shares.
  tailscale:
    image: tailscale/tailscale:latest
    env_file: *stack-env
    container_name: mcp-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      TS_HOSTNAME: mcp
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json

    # ── Network ───────────────────────────────────────────────
    ports:
      - "8485:8485"   # synology, for existing clients (http://nas.<tailnet>:8485/mcp)

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/mcp/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/mcp/ts-config:/config

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.27.0/24
