services:
  # ---------------------------------------------------------------------------
  # Main application — Langfuse LLM observability platform
  # ---------------------------------------------------------------------------
  langfuse:
    # 1. Identity
    image: langfuse/langfuse:latest  # Official Langfuse image
    container_name: langfuse  # Container name

    # 2. Lifecycle
    restart: unless-stopped  # Auto-restart on failure
    depends_on:
      postgres:
        condition: service_healthy  # Wait for PostgreSQL to be ready

    # 3. Network
    ports:
      - "3000:3000"  # Web UI port

    # 4. Storage
    volumes:
      - /volume1/docker/stacks/langfuse/data:/data  # Persistent data directory

    # 5. Environment
    environment:
      - SALT=${LANGFUSE_SALT}  # Random salt for encryption
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}  # NextAuth secret
      - LANGFUSE_SALT=${LANGFUSE_SALT}  # Encryption salt
      - POSTGRES_USER=${LANGFUSE_DB_USER}  # Database username
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}  # Database password
      - POSTGRES_HOST=postgres  # Database hostname
      - POSTGRES_PORT=5432  # Database port
      - POSTGRES_DB=${LANGFUSE_DB_NAME}  # Database name
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL}  # NextAuth URL

  # ---------------------------------------------------------------------------
  # PostgreSQL database — primary data store
  # ---------------------------------------------------------------------------
  postgres:
    # 1. Identity
    image: postgres:16-alpine  # PostgreSQL 16 with minimal Alpine base
    container_name: langfuse-postgres  # Database container name

    # 2. Lifecycle
    restart: unless-stopped  # Auto-restart on failure

    # 4. Storage
    volumes:
      - /volume1/docker/stacks/langfuse/postgres:/var/lib/postgresql/data  # PostgreSQL data

    # 5. Environment
    environment:
      - POSTGRES_USER=${LANGFUSE_DB_USER}  # Database username
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}  # Database password
      - POSTGRES_DB=${LANGFUSE_DB_NAME}  # Database name

    # 6. Runtime
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${LANGFUSE_DB_USER} -d ${LANGFUSE_DB_NAME}  # Check readiness
      interval: 10s  # Check every 10 seconds
      timeout: 5s  # Timeout after 5 seconds
      retries: 5  # Max 5 retries
