# Langfuse — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: LLM observability and tracing platform
#
# Services:
#   - langfuse
#   - postgres
#
# Environment variables:
#   - STACK_NAME=Langfuse
#   - LANGFUSE_SALT=${LANGFUSE_SALT}
#   - LANGFUSE_NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
#   - LANGFUSE_DB_USER=${LANGFUSE_DB_USER}
#   - LANGFUSE_DB_PASSWORD=${LANGFUSE_DB_PASSWORD}
#   - LANGFUSE_DB_NAME=${LANGFUSE_DB_NAME}
#   - LANGFUSE_NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f langfuse.yaml up -d
#   docker compose -f langfuse.yaml down
#
name: langfuse
version: "3.8"

services:
  # ── Identity ──────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    ports:
      - "3000:3000"                 # Web UI port

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/data:/data  # Persistent data directory

    # ── Environment ───────────────────────────────────────────
    environment:
      - SALT=${LANGFUSE_SALT}                     # Random salt for encryption
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}  # NextAuth secret
      - LANGFUSE_SALT=${LANGFUSE_SALT}            # Encryption salt
      - POSTGRES_USER=${LANGFUSE_DB_USER}         # Database username
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD} # Database password
      - POSTGRES_HOST=postgres                    # Database hostname
      - POSTGRES_PORT=5432                        # Database port
      - POSTGRES_DB=${LANGFUSE_DB_NAME}           # Database name
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL}     # NextAuth URL

  # ── Identity ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/postgres:/var/lib/postgresql/data  # PostgreSQL data

    # ── Environment ───────────────────────────────────────────
    environment:
      - POSTGRES_USER=${LANGFUSE_DB_USER}         # Database username
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD} # Database password
      - POSTGRES_DB=${LANGFUSE_DB_NAME}           # Database name

    # ── Runtime ───────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER} -d ${LANGFUSE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
