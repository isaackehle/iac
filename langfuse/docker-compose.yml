# Langfuse — Docker Compose Stack
#
# Stack version: 2.0
# Purpose: LLM observability and tracing platform
#
# Services:
#   - primary          (web/API)
#   - worker            (async trace ingestion)
#   - tailscale (Tailscale sidecar — owns the netns for `primary`)
#   - config            (trace/observation storage)
#   - cache             (queues/caching)
#   - storage           (S3-compatible blob storage)
#
# Postgres is NOT part of this stack — it reuses the existing `postgresql`
# stack on the NAS. There is a one-time manual CREATE DATABASE / CREATE USER
# step before first deploy; see .env.example and postgresql/DEBUG.md.
#
# Pattern B (Tailscale sidecar) with siblings: `primary` runs
# `network_mode: service:tailscale` and has no ports/networks of its
# own. The sidecar also joins `langfuse_langfuse-net`, which is what lets `primary`
# resolve `config`/`cache`/`storage` by name. Both conditions must hold —
# see langfuse/DEBUG.md.
#
# CRITICAL: Because `primary` and `worker` use `network_mode: service:tailscale`,
# they inherit their environment from the sidecar container. All required env vars
# (DATABASE_URL, CLICKHOUSE_URL, REDIS_CONNECTION_STRING, etc.) MUST be defined
# on the tailscale service, NOT on primary/worker directly. env_file on
# primary/worker is IGNORED when using network_mode: service:...
#
# storage's S3 API is published directly on the `storage` sibling (host 9090),
# deliberately not routed through the sidecar — see README.md's port registry.
#
#   See .env.example for all required variables
#
# Deployment:
#   docker compose up -d
#   docker compose down
#

name: langfuse

x-stack-env: &stack-env
  - /volume1/docker/stacks/config/global.env
  - /volume1/docker/stacks/config/langfuse/service.env

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: langfuse/langfuse:3
    env_file: *stack-env
    container_name: langfuse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_started
      config:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale  # Borrow the sidecar's namespace

  # ── Identity ──────────────────────────────────────────────
  # Async ingestion. Traces land here, not in the web container — if traces
  # aren't showing up in the UI, read this container's logs first.
  worker:
    image: langfuse/langfuse-worker:3
    env_file: *stack-env
    container_name: langfuse-worker

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      config:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale  # Borrow the sidecar's namespace

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    env_file: *stack-env
    container_name: langfuse-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    # Must join langfuse_langfuse-net: `primary` borrows this namespace, so this is
    # what lets it resolve clickhouse/redis/minio by name.
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/langfuse/ts-config:/config

    # ── Environment (sidecar-only overrides) ──────────────────
    environment:
      # Tailscale config
      TS_HOSTNAME: langfuse
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN}

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Identity ──────────────────────────────────────────────
  config:
    image: clickhouse/clickhouse-server:24.3
    env_file: *stack-env
    container_name: langfuse-clickhouse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/clickhouse-data:/var/lib/clickhouse
      - /volume1/docker/stacks/langfuse/clickhouse-logs:/var/log/clickhouse-server

    # ── Runtime ───────────────────────────────────────────────
    user: "101:101"     # clickhouse-server's own uid/gid — mounted volumes
                        # must match or it can't write on first start
                        # (mirrored in scripts/lib.sh STACK_CHOWN_OVERRIDES)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Identity ──────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    env_file: *stack-env
    container_name: langfuse-redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/redis-data:/data

    # ── Runtime ───────────────────────────────────────────────
    command: --requirepass ${LANGFUSE_REDIS_AUTH}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  storage:
    image: minio/minio:latest
    env_file: *stack-env
    container_name: langfuse-minio

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net
    ports:
      - "9090:9000"     # S3 API — published directly, not via the sidecar

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/minio-data:/data

    # ── Runtime ───────────────────────────────────────────────
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --address ":9000" --console-address ":9001"'
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
# langfuse creates this network (it used to be created by hand as "external").
# postgresql joins it as external, so deploy langfuse before postgresql.
networks:
  langfuse_langfuse-net:
    name: langfuse_langfuse-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.28.0/24
