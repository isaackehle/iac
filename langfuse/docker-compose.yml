# Langfuse — Docker Compose Stack
#
# Stack version: 2.0
# Purpose: LLM observability and tracing platform
#
# Services:
#   - primary          (web/API)
#   - worker            (async trace ingestion)
#   - tailscale-sidecar (Tailscale sidecar — owns the netns for `primary`)
#   - config            (trace/observation storage)
#   - cache             (queues/caching)
#   - storage           (S3-compatible blob storage)
#
# Postgres is NOT part of this stack — it reuses the existing `postgresql`
# stack on the NAS. There is a one-time manual CREATE DATABASE / CREATE USER
# step before first deploy; see .env.example and postgresql/DEBUG.md.
#
# Pattern B (Tailscale sidecar) with siblings: `primary` runs
# `network_mode: service:tailscale-sidecar` and has no ports/networks of its
# own. The sidecar also joins `langfuse_langfuse-net`, which is what lets `primary`
# resolve `config`/`cache`/`storage` by name. Both conditions must hold —
# see langfuse/DEBUG.md.
#
# CRITICAL: Because `primary` and `worker` use `network_mode: service:tailscale-sidecar`,
# they inherit their environment from the sidecar container. All required env vars
# (DATABASE_URL, CLICKHOUSE_URL, REDIS_CONNECTION_STRING, etc.) MUST be defined
# on the tailscale-sidecar service, NOT on primary/worker directly. env_file on
# primary/worker is IGNORED when using network_mode: service:...
#
# storage's S3 API is published directly on the `storage` sibling (host 9090),
# deliberately not routed through the sidecar — see README.md's port registry.
#
# Environment variables:
#   - STACK_NAME=Langfuse
#   See .env.example for all required variables — none have working defaults,
#   the stack fails to start rather than running with a placeholder secret.
#
# Deployment:
#   docker compose up -d
#   docker compose down
#

name: langfuse

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: langfuse/langfuse:3
    container_name: langfuse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      tailscale-sidecar:
        condition: service_started
      config:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar  # Borrow the sidecar's namespace

    # ── Environment ───────────────────────────────────────────
    # All env vars are passed via Portainer API / env vars
    # env_file removed because Portainer API passes env vars directly
    environment:
      # Postgres
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@${LANGFUSE_DB_HOST}:${LANGFUSE_DB_PORT}/langfuse
      # App secrets
      - SALT=${LANGFUSE_SALT}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - NEXTAUTH_URL=https://${TS_CERT_DOMAIN}
      # ClickHouse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      # Redis
      - REDIS_CONNECTION_STRING=redis://:${LANGFUSE_REDIS_AUTH}@redis:6379
      # MinIO / S3
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      # Headless bootstrap
      - LANGFUSE_INIT_ORG_ID=default
      - LANGFUSE_INIT_PROJECT_ID=default
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
      - TELEMETRY_ENABLED=false

    # ── Identity ──────────────────────────────────────────────
  # Async ingestion. Traces land here, not in the web container — if traces
  # aren't showing up in the UI, read this container's logs first.
  worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      config:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    network_mode: service:tailscale-sidecar  # Borrow the sidecar's namespace

    # ── Environment ───────────────────────────────────────────
    # All env vars are passed via Portainer API / env vars
    environment:
      # Postgres
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@${LANGFUSE_DB_HOST}:${LANGFUSE_DB_PORT}/langfuse
      # App secrets
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      # ClickHouse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      # Redis
      - REDIS_CONNECTION_STRING=redis://:${LANGFUSE_REDIS_AUTH}@redis:6379
      # MinIO / S3
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - TELEMETRY_ENABLED=false

    # ── Identity ──────────────────────────────────────────────
  tailscale-sidecar:
    image: tailscale/tailscale:latest
    container_name: ts-langfuse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    # Must join langfuse_langfuse-net: `primary` borrows this namespace, so this is
    # what lets it resolve clickhouse/redis/minio by name.
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/ts-state:/var/lib/tailscale
      - /volume1/docker/stacks/langfuse/ts-config:/config

    # ── Environment ───────────────────────────────────────────
    # CRITICAL: primary and worker inherit this environment via network_mode: service:tailscale-sidecar
    # env_file removed - Portainer API passes env vars directly
    environment:
      # Tailscale config
      - TS_HOSTNAME=langfuse
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}
      # Langfuse app config (inherited by primary and worker containers)
      - DATABASE_URL=postgresql://langfuse:***@${LANGFUSE_DB_HOST}:${LANGFUSE_DB_PORT}/langfuse
      - SALT=${LANGFUSE_SALT}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - NEXTAUTH_URL=https://${TS_CERT_DOMAIN}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_CONNECTION_STRING=redis://:${LANGFUSE_REDIS_AUTH}@redis:6379
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_INIT_ORG_ID=default
      - LANGFUSE_INIT_PROJECT_ID=default
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
      - TELEMETRY_ENABLED=false

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Identity ──────────────────────────────────────────────
  config:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/clickhouse-data:/var/lib/clickhouse
      - /volume1/docker/stacks/langfuse/clickhouse-logs:/var/log/clickhouse-server

    # ── Environment ─────────────────────────────────────────────
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD}

    # ── Runtime ───────────────────────────────────────────────
    user: "101:101"     # clickhouse-server's own uid/gid — mounted volumes
                        # must match or it can't write on first start
                        # (mirrored in scripts/lib.sh STACK_CHOWN_OVERRIDES)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Identity ──────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: langfuse-redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/redis-data:/data

    # ── Environment ─────────────────────────────────────────────
    environment:
      - REDIS_AUTH=${LANGFUSE_REDIS_AUTH}

    # ── Runtime ───────────────────────────────────────────────
    command: --requirepass ${LANGFUSE_REDIS_AUTH}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ──────────────────────────────────────────────
  storage:
    image: minio/minio:latest
    container_name: langfuse-minio

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - langfuse_langfuse-net
    ports:
      - "9090:9000"     # S3 API — published directly, not via the sidecar

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/langfuse/minio-data:/data

    # ── Environment ─────────────────────────────────────────────
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=${LANGFUSE_MINIO_ROOT_PASSWORD}

    # ── Runtime ───────────────────────────────────────────────
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --address ":9000" --console-address ":9001"'
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  langfuse_langfuse-net:
    external: true
    name: langfuse_langfuse-net