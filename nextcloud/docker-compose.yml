# Nextcloud — Docker Compose Stack
#
# Stack version: 1.0
# Purpose: Personal cloud storage and collaboration platform
#
# Services:
#   - primary
#   - tailscale (Tailscale sidecar)
#   - config (PostgreSQL database)
#   - cache (Redis cache)
#   - db-init (one-shot: lets Nextcloud's own DB user create tables)
#   - cron (runs Nextcloud background jobs every 5 minutes)
#
# Environment variables:
#   - STACK_NAME=Nextcloud
#   - NC_DB_PASSWORD=${NC_DB_PASSWORD}
#   - NC_ADMIN_USER=${NC_ADMIN_USER}
#   - NC_ADMIN_PASSWORD=${NC_ADMIN_PASSWORD}
#   - TS_AUTHKEY=${TS_AUTHKEY}
#   - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}
#   See .env.example for all required variables
#
# Deployment:
#   docker compose -f nextcloud.yaml up -d
#   docker compose -f nextcloud.yaml down
#
# Networking (Pattern B inverted — primary owns namespace):
#   The primary owns the network namespace and joins nextcloud-net,
#   allowing it to resolve config/cache by name. Both sidecars borrow
#   the primary's namespace (network_mode: service:primary), so the
#   Tailscale sidecar can proxy to the app over 127.0.0.1.
#

name: nextcloud

services:
  # ── Identity ──────────────────────────────────────────────
  primary:
    image: nextcloud:apache
    container_name: nextcloud

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    ports:
      - "8281:80/tcp"               # Web interface (8280 is pihole's)
    hostname: nextcloud
    networks:
      - nextcloud-net
    depends_on:
      config:
        condition: service_healthy
      cache:
        condition: service_started
      db-init:
        condition: service_completed_successfully

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/nextcloud/app:/var/www/html
      - /volume1/docker/stacks/nextcloud/data:/var/www/html/data

    # ── Environment ───────────────────────────────────────────
    # Anchored: cron needs the same values (the image's redis and
    # reverse-proxy config files read them at runtime).
    environment: &nextcloud-env
      - POSTGRES_HOST=config
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NC_DB_PASSWORD}
      - REDIS_HOST=cache
      - NEXTCLOUD_ADMIN_USER=${NC_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NC_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${TS_CERT_DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://${TS_CERT_DOMAIN}
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=10G

  # ── Identity ──────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: nextcloud-tailscale

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    network_mode: service:primary   # Share the primary's network stack

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/nextcloud/ts-config:/config
      - /volume1/docker/stacks/nextcloud/ts-state:/var/lib/tailscale

    # ── Environment ───────────────────────────────────────────
    environment:
      - TS_HOSTNAME=nextcloud
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json

    # ── Runtime ───────────────────────────────────────────────
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

  # ── Identity ──────────────────────────────────────────────
  config:
    image: postgres:16
    container_name: nextcloud-db

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - nextcloud-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/nextcloud/postgres:/var/lib/postgresql/data

    # ── Environment ───────────────────────────────────────────
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NC_DB_PASSWORD}

    # ── Health ────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Identity ──────────────────────────────────────────────
  # One-shot, runs on every start (idempotent). Nextcloud's installer creates
  # its own DB user (oc_<admin>), and since PostgreSQL 15 only the schema
  # owner may create tables in `public`. Without this grant the install fails
  # with "no schema has been selected to create in" or "permission denied for
  # table oc_migrations" (2026-09-27).
  db-init:
    image: postgres:16
    container_name: nextcloud-db-init

    # ── Lifecycle ─────────────────────────────────────────────
    restart: "no"
    depends_on:
      config:
        condition: service_healthy

    # ── Network ───────────────────────────────────────────────
    networks:
      - nextcloud-net

    # ── Environment ───────────────────────────────────────────
    environment:
      - PGHOST=config
      - PGUSER=nextcloud
      - PGDATABASE=nextcloud
      - PGPASSWORD=${NC_DB_PASSWORD}

    # ── Runtime ───────────────────────────────────────────────
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-c", "GRANT USAGE, CREATE ON SCHEMA public TO PUBLIC"]

  # ── Identity ──────────────────────────────────────────────
  # Background jobs. The image's /cron.sh runs cron.php as www-data every
  # 5 minutes; Nextcloud must be switched to cron mode once (INSTALLATION.md).
  cron:
    image: nextcloud:apache
    container_name: nextcloud-cron

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped
    depends_on:
      - primary

    # ── Network ───────────────────────────────────────────────
    networks:
      - nextcloud-net

    # ── Storage ───────────────────────────────────────────────
    volumes:
      - /volume1/docker/stacks/nextcloud/app:/var/www/html
      - /volume1/docker/stacks/nextcloud/data:/var/www/html/data

    # ── Environment ───────────────────────────────────────────
    environment: *nextcloud-env

    # ── Runtime ───────────────────────────────────────────────
    entrypoint: /cron.sh

  # ── Identity ──────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: nextcloud-redis

    # ── Lifecycle ─────────────────────────────────────────────
    restart: unless-stopped

    # ── Network ───────────────────────────────────────────────
    networks:
      - nextcloud-net

# Pinned: DSM's firewall drops forwarded traffic from Docker's default
# 192.168.x.0/20 pool, which silently kills outbound access (image pulls,
# Tailscale DERP, certificates). See README "Rules that have caused outages".
networks:
  nextcloud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.30.0/24
